<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM Technology </title>
  <link rel="stylesheet" href="estilo.css"> <!-- Referência ao arquivo CSS -->
</head>
<body>


    <div class="topo">

    </div>

  <div class="container">
    <!-- Parte Esquerda: Logo e Texto -->
   
   
    <div class="parte1">
      <div class="logo">
        <h1>RM Technology</h1>
      </div>
    </div>

    <!-- Parte Direita: Formulário de Login -->
    <div class="parte2">
      <form class="login-form">
        <h2>Login</h2>
        <input type="email" name="email" placeholder="Digite seu email" required>
        <input type="password" name="senha" placeholder="Digite sua senha" required>
        <button type="submit">Entrar</button>
        
        <div class="links">
          <a href="#">Cadastre-se</a> | <a href="#">Esqueceu a senha?</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
